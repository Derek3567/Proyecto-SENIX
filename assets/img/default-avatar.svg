<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
    <defs>
        <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#00f0ff;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#b026ff;stop-opacity:1" />
        </linearGradient>
        <filter id="glow">
            <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    <rect width="200" height="200" fill="#0a0e17"/>
    <circle cx="100" cy="100" r="85" fill="none" stroke="url(#grad)" stroke-width="3" opacity="0.5"/>
    <circle cx="100" cy="75" r="35" fill="url(#grad)" filter="url(#glow)" opacity="0.85"/>
    <path d="M 40 175 Q 40 130 100 130 Q 160 130 160 175 Z" fill="url(#grad)" filter="url(#glow)" opacity="0.85"/>
    <text x="100" y="105" font-family="Orbitron, sans-serif" font-size="42" font-weight="900" fill="#0a0e17" text-anchor="middle" dominant-baseline="middle">?</text>
</svg>
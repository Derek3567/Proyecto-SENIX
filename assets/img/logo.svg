<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100">
    <defs>
        <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#00f0ff" />
            <stop offset="50%" style="stop-color:#b026ff" />
            <stop offset="100%" style="stop-color:#ff006e" />
        </linearGradient>
        <filter id="logoGlow">
            <feGaussianBlur stdDeviation="4" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    <text x="20" y="65" font-family="Orbitron, sans-serif" font-size="52" font-weight="900" fill="url(#logoGrad)" filter="url(#logoGlow)" letter-spacing="6">SENIX</text>
</svg>